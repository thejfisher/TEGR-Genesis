# TEGR Genesis experiment. Open it with File > Open Experiment.
# Preset 43: Double-Slit Quantum Interference (Tonomura Protocol & Phase Prism)

[experiment]
name = "Double Slit Interference (Preset 43)"
notes = "Preset 43: Coherent pilot wave diffraction across dual 5-unit slits (y = +/- 3.0) with dBB phase routing"
