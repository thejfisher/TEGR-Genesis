# TEGR Genesis experiment. Open it with File > Open Experiment.
# Self-contained: physics settings + every item on the grid.

[experiment]
name = "Double Slit Interference"
notes = "Tonomura double-slit experiment: discrete lattice wave diffraction and phase-coupled particle guidance"
app = "TEGR Genesis"
format_version = 1
saved = "2026-10-22T17:15:00"

[settings]
physics_rule = "ms38"
grid_resolution = 64
dx = 2.0
dt = 0.005
total_ticks = 4000
c_base = 65.0
alpha = 0.0
c2_min = 1.0
sponge_width = 8
sponge_strength = 0.35
source_strength = 1.0
source_local_speed = false
field_force = 100.0
source_ramp_ticks = 500
warmup_ticks = 500
time_centred_force = true
body_kernel = "tsc"
body_width = 2.8125
pauli_strength = 500.0
pauli_power = 2.0
decay_base = 0.999
decay_gamma = 0.5
legacy_periodic = true
legacy_source = 0.0
legacy_seed = true
record_every = 20
max_field_frames = 200
divergence_limit = 0.0
horizon_threshold = 1.0
hardware = "auto"

